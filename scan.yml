name: Ranní sken nabídek

on:
  schedule:
    # 05:10 UTC = 07:10 v létě, 06:10 v zimě
    - cron: "10 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sken
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sken a hodnocení
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m scanner.main

      - name: Uložit výsledky
        run: |
          git config user.name "job-radar"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add data/jobs.json data/companies.json data/kurzy.json
          git diff --staged --quiet || git commit -m "Sken $(date -u +%Y-%m-%d)"
          git push
